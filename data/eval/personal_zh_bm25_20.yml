    expected_terms: ["ShowMaker", "世界第一中单", "重铸LCK荣光我辈义不容辞"]
    forbidden_claim_patterns: ["ShowMaker.{0,12}(又被称为|又称|也叫|也称|别名).{0,12}(炫神|炫狗)", "ShowMaker.{0,20}(冠军|数据|荣誉)"]
    category: compound_factual
    tags: ["real_user", "entity_binding", "partial_answer", "regression"]
